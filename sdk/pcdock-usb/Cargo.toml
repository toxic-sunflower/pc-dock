[package]
name = "pcdock-usb"
version.workspace = true
edition.workspace = true
description = "USB-адаптер PC Dock: выполняет запросы ядра через libusb."
license.workspace = true
repository.workspace = true
publish = false
[dependencies]
pcdock-core = { path = "../pcdock-core" }
rusb = "0.9"

# Windows и macOS: libusb собирается из исходников и линкуется статически (в Windows системной библиотеки нет; в macOS
# Homebrew-libusb есть не у всех, а подписанное приложение чужую библиотеку не загрузит — разные Team ID).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
